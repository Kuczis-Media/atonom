<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Atonom - Kuczi$</title>
    <link rel="icon" href="https://cdn.jsdelivr.net/gh/Kuczis-Media/logo/benzene-ring.svg" type="image/svg+xml">

    <script src="jquery-1.8.3.min.js"></script>
    <script src="scripts/chosen.jquery.min.js"></script>
    <script src="scripts/physicsjs/physicsjs-full-0.5.1.js"></script>
    <script src="scripts/three.min.js"></script>
    <script src="scripts/main.js"></script>
    <script src="scripts/Smidge.js"></script>
    <script src="script.js"></script>
    <script src="scanner.js"></script>
    <script src="iupac.js"></script>
    <link rel="stylesheet" href="css/chosen.css">
</head>
<body>
    <h1>Atonom</h1>
    <h2>&copy; Hipolit Płatek</h2>

    <div class="content">
        <div class="left-section">
            <label for="iupacName" class="content1">Enter IUPAC Name:</label>

            <div class="shine">
                <input type="text"  id="iupacName" class="curved-textfield" value="">

              </div>
            <button id="parseButton">Parse</button>
            <button onclick="window.location.href='README.md'" target="_blanc">Instrukcja</button>


            <p class="content1">Select molecule:</p>
            <select id="moleculeselect" class="my_select_box" data-placeholder="Select Molecule">
                <option value=""></option>
            </select>

            <p class="content2"> Energy: </br>
                <input id="dragRange" style="width: 75%;" type="range" min="1" max="1000" value="100" class="dragRange" />
                <span id="dragRangeValue">0.01</span>
            </p>
            <p class="content2"> Camera height: </br>
                <input id="cameraHeight" type="range" min="1" max="1000" value="500" style="width: 75%;" class="dragRange" />
                <span id="cameraHeightValue">0</span>
            </p>
            <p class="content2"> Camera distance: </br>
                <input id="cameraDistance" type="range" min="1" max="1000" value="300" style="width: 75%;" class="dragRange" />
                <span id="cameraDistanceValue">3.0</span>
            </p>
            

            <p><button id="startButton">Start</button> <button id="stopButton">Stop</button></p>
        </div>
        <div class="right-section">
            <div id="3dcontainer" style="max-width: 50%;"></div>
        </div>
    </div>
</body>
</html>
